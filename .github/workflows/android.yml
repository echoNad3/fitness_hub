name: Build Fitness Hub Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'brand/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'scripts/sync-brand-assets.mjs'
      - 'scripts/sync-theme-assets.mjs'
      - 'scripts/theme-tokens.mjs'
      - 'src/theme.css'
      - '.github/workflows/android.yml'

permissions: {}

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build and sync Android project
        run: npm run android:sync

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android 36 platform
        run: sdkmanager 'platforms;android-36'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PappBuildNumber=${{ github.run_number }}

      - name: Write checksum and release notes
        run: |
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          {
            echo "Fitness Hub Android debug build ${{ github.run_number }}."
            echo
            echo "Change: $(git -C ../../../../../.. log -1 --pretty=%s)"
            echo "Commit: ${{ github.sha }}"
            echo
            echo "The SHA-256 file can verify that the APK downloaded without being changed."
          } > android-release-notes.md

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fitness-hub-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/android-release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish-debug-apk:
    runs-on: ubuntu-latest
    needs: build-debug-apk
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fitness-hub-debug-apk
          path: android-release

      - name: Publish APK to a release (stable download link)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: android-v${{ github.run_number }}
          name: Android APK build ${{ github.run_number }}
          make_latest: true
          body_path: android-release/android-release-notes.md
          files: |
            android-release/app-debug.apk
            android-release/app-debug.apk.sha256

      - name: Refresh the deployed Android version metadata
        run: gh workflow run deploy.yml --ref main -f android_build=${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
