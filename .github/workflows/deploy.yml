name: Deploy Fitness Hub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      android_build:
        description: Android build that must be visible before deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Android release metadata
        run: node scripts/write-android-release-manifest.mjs
        env:
          ANDROID_BUILD: ${{ inputs.android_build }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run tests
        run: npm test

      - name: Verify Supabase row security
        run: npm run security:rls

      - name: Run lint
        run: npm run lint

      - name: Build site
        run: npm run build

      - name: Install browser for responsive tests
        run: npx playwright install --with-deps chromium

      - name: Test phone layouts and core flows
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
